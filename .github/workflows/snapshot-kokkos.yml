name: snapshot-kokkos
on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * *

permissions:
  contents: read

jobs:
  kokkos-snapshot:
    permissions:
      contents: write
      pull-requests: write
    if: ${{ github.repository == 'trilinos/Trilinos' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.SNAPSHOT_APP_ID }}
          private-key: ${{ secrets.SNAPSHOT_APP_PRIVATE_KEY }}

      - name: Clone Trilinos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          path: Trilinos

      - name: Clone Kokkos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kokkos/kokkos
          ref: develop
          path: kokkos

      - name: Clone Kokkos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kokkos/kokkos-kernels
          ref: develop
          path: kokkos-kernels

      - name: Configure git
        run: |
          git config --global user.name "Snapshot Action"
          git config --global user.email "snapshot@action.com"

      - name: Snapshot Kokkos
        run: |
          kokkos/scripts/snapshot.py --verbose kokkos Trilinos/packages/

      - name: Snapshot Kokkos-Kernels
        run: |
          kokkos/scripts/snapshot.py --verbose kokkos-kernels Trilinos/packages/

      - name: Create/update PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          path: Trilinos
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: "Snapshot Kokkos and Kokkos-Kernels"
          title: "Snapshot of Kokkos and Kokkos-Kernels"
          body: |
            Automatic snapshot of Kokkos and Kokkos-Kernels.
            This snapshot gets updated via a GitHub Action.
          branch: kokkos-snapshot
          base: develop
          delete-branch: true
          draft: true
          labels: |
            pkg: Kokkos
            pkg: KokkosKernels
